# env
objectives_plan: objectives_kq
init_plan: init_plan_kq

# reward
reward_specs:
  road_network_weight: 0.0
  life_circle_weight: 1.0
  greenness_weight: 0.0
  concept_weight: 0.0
  carbon_emission_weight: 0.4
  shaping_weight: 1.0
  weight_by_area: true



# agent
agent_specs:
  batch_stage: false

# training parameters
skip_land_use: false
skip_road: true
road_ratio: 0.80
gamma: 1.0
tau: 0.0
state_encoder_specs:
  encoder_type: sgnn
  state_encoder_hidden_size: [64, 16]
  gcn_node_dim: 16
  num_gcn_layers: 2
  num_edge_fc_layers: 1
  max_num_nodes: 1000
  max_num_edges: 4000
  num_attention_heads: 1
policy_specs:
  # 是否使用Transformer策略网络
  use_transformer_policy: true
  # Transformer策略网络参数
  transformer_policy_hidden_size: 16
  transformer_policy_heads: 2
  transformer_policy_layers: 2
  # 原始MLP策略网络参数（备用）
  policy_land_use_head_hidden_size: [32, 1]
  policy_road_head_hidden_size: [32, 1]
value_specs:
  value_head_hidden_size: [32, 32, 1]
lr: 8.0e-4
weightdecay: 0.0
eps: 1.0e-5
value_pred_coef: 0.5
entropy_coef: 0.01
clip_epsilon: 0.2
max_num_iterations: 500
num_episodes_per_iteration: 200
max_sequence_length: 120
num_optim_epoch: 4
mini_batch_size: 64
save_model_interval: 10
